<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dashboard | Portfolio</title>
		<link rel="stylesheet" href="/styles.css" />
		<style>
			.admin-login {
				max-width: 400px;
				margin: 100px auto;
				padding: 2rem;
				background: var(--card-bg);
				border-radius: 8px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			}

			.admin-login h1 {
				text-align: center;
				margin-bottom: 2rem;
				color: var(--text-primary);
			}

			.admin-form {
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}

			.form-group {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}

			.form-group label {
				color: var(--text-primary);
				font-weight: 500;
			}

			.form-group input {
				padding: 0.75rem;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				background: var(--input-bg);
				color: var(--text-primary);
			}

			.error-message {
				color: #dc2626;
				font-size: 0.875rem;
				margin-top: 0.5rem;
				display: none;
			}

			.error-message.show {
				display: block;
			}

			.admin-dashboard {
				display: none;
				margin: 2rem auto;
				max-width: 800px;
				padding: 2rem;
				background: var(--card-bg);
				border-radius: 8px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			}

			.admin-dashboard h2 {
				color: var(--text-primary);
				font-size: 1.8rem;
				margin-bottom: 1.5rem;
				border-bottom: 2px solid var(--border-color);
				padding-bottom: 0.5rem;
			}

			.admin-dashboard.show {
				display: block;
			}

			.contact-list {
				display: grid;
				gap: 1.5rem;
			}

			.contact-item {
				background: var(--background);
				padding: 1.5rem;
				border-radius: 8px;
				border: 1px solid var(--border-color);
				transition: transform 0.2s, box-shadow 0.2s;
			}

			.contact-item:hover {
				transform: translateY(-2px);
				box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
			}

			.contact-item h3 {
				margin: 0 0 0.75rem 0;
				color: var(--text-primary);
				font-size: 1.4rem;
			}

			.contact-item .contact-meta {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin: 0.5rem 0;
				font-size: 0.9rem;
				color: var(--text-tertiary);
			}

			.contact-item .contact-email {
				color: var(--text-secondary);
				font-weight: 500;
				text-decoration: none;
			}

			.contact-item .contact-email:hover {
				text-decoration: underline;
			}

			.contact-item .contact-message {
				margin: 1rem 0;
				color: var(--text-primary);
				line-height: 1.6;
				white-space: pre-wrap;
			}

			.contact-item .contact-date {
				font-style: italic;
			}

			.logout-btn {
				position: absolute;
				top: 1rem;
				right: 1rem;
				padding: 0.5rem 1rem;
				background: var(--danger);
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				transition: background 0.2s;
			}

			.logout-btn:hover {
				background: var(--danger-dark);
			}
		</style>
	</head>
	<body>
		<div class="admin-login">
			<h1>Dashboard Login</h1>
			<form id="loginForm" class="admin-form">
				<div class="form-group">
					<label for="username">Username</label>
					<input type="text" id="username" name="username" required />
				</div>
				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" id="password" name="password" required />
				</div>
				<div class="error-message" id="errorMessage"></div>
				<button type="submit" class="btn btn-primary">Login</button>
			</form>

			<div id="adminDashboard" class="admin-dashboard">
				<button id="logoutBtn" class="logout-btn">Logout</button>
				<h2>Contact Submissions</h2>
				<div id="contactList" class="contact-list"></div>
			</div>
		</div>

		<script>
			// Check if the page is loaded in an iframe
			if (window.self !== window.top) {
				window.top.location.href = window.self.location.href;
			}

			const loginForm = document.getElementById("loginForm");
			const errorMessage = document.getElementById("errorMessage");
			const adminDashboard = document.getElementById("adminDashboard");
			const contactList = document.getElementById("contactList");
			const logoutBtn = document.getElementById("logoutBtn");

			loginForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				const username = document.getElementById("username").value;
				const password = document.getElementById("password").value;

				try {
					console.log("Attempting login...");
					const response = await fetch("/api/auth/login", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify({ username, password }),
					});

					console.log("Login response:", response);
					const data = await response.json();
					console.log("Login data:", data);

					if (data.success) {
						console.log("Login successful, storing token...");
						// Store the token
						localStorage.setItem("adminToken", data.token);
						// Show dashboard
						loginForm.style.display = "none";
						adminDashboard.classList.add("show");
						console.log("Loading contacts...");
						// Load contacts
						loadContacts();
					} else {
						console.log("Login failed:", data.message);
						showError(data.message);
					}
				} catch (error) {
					console.error("Login error:", error);
					showError("An error occurred during login");
				}
			});

			async function loadContacts() {
				try {
					console.log("Starting to load contacts...");
					const token = localStorage.getItem("adminToken");
					console.log("Token from localStorage:", token);

					if (!token) {
						console.log("No token found");
						showError("Not authenticated");
						return;
					}

					console.log("Fetching contacts...");
					const response = await fetch("/api/admin/contacts", {
						headers: {
							Authorization: `Bearer ${token}`,
						},
					});
					console.log("Contacts response:", response);

					const data = await response.json();
					console.log("Contacts data:", data);

					if (data.success) {
						console.log("Displaying contacts...");
						displayContacts(data.data);
					} else {
						console.log("Failed to load contacts:", data.message);
						showError(data.message);
					}
				} catch (error) {
					console.error("Error loading contacts:", error);
					showError("Error loading contacts");
				}
			}

			function displayContacts(contacts) {
				contactList.innerHTML = contacts
					.map(
						(contact) => `
                <div class="contact-item">
                    <h3>${contact.name}</h3>
                    <div class="contact-meta">
                        <a href="mailto:${
													contact.email
												}" class="contact-email">${contact.email}</a>
                        <span class="contact-date">Received: ${new Date(
													contact.createdAt
												).toLocaleString()}</span>
                    </div>
                    <p class="contact-message">${contact.message}</p>
                </div>
            `
					)
					.join("");
			}

			function showError(message) {
				errorMessage.textContent = message;
				errorMessage.classList.add("show");
				setTimeout(() => {
					errorMessage.classList.remove("show");
				}, 3000);
			}

			// Handle logout
			logoutBtn.addEventListener("click", () => {
				localStorage.removeItem("adminToken");
				adminDashboard.classList.remove("show");
				loginForm.style.display = "block";
				loginForm.reset();
			});

			// Check if already logged in
			const token = localStorage.getItem("adminToken");
			if (token) {
				loginForm.style.display = "none";
				adminDashboard.classList.add("show");
				loadContacts();
			}

			// Prevent browser password saving
			document
				.getElementById("password")
				.setAttribute("autocomplete", "new-password");
		</script>
	</body>
</html>
